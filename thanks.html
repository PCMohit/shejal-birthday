<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reply received · For Shejal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b14;--panel:rgba(28,24,38,.88);--line:rgba(255,255,255,.12);--text:#f7f1f3;--muted:#b9b2c0;--pink:#f2a9c9;--peach:#ffd5b1;--mint:#a9dfd0}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 30% 20%,rgba(242,169,201,.12),transparent 35%),radial-gradient(circle at 80% 70%,rgba(199,181,255,.1),transparent 35%),var(--bg);color:var(--text);font-family:"DM Sans",system-ui,sans-serif}
.card{width:min(720px,100%);padding:clamp(30px,7vw,64px);border:1px solid var(--line);border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),var(--panel);box-shadow:0 40px 100px rgba(0,0,0,.45);text-align:center;backdrop-filter:blur(24px)}
.kicker{font-size:10px;letter-spacing:.2em;color:var(--pink);text-transform:uppercase}.mark{width:72px;height:72px;margin:22px auto;border:1px solid rgba(242,169,201,.32);border-radius:50%;display:grid;place-items:center;font-size:32px;background:rgba(242,169,201,.08)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(52px,9vw,82px);line-height:.9;margin:0 0 20px}h1 em{color:var(--pink)}p{font-size:17px;line-height:1.8;color:var(--muted);max-width:560px;margin:0 auto 28px}.note{font-size:11px;color:var(--mint);letter-spacing:.08em;text-transform:uppercase}.back{display:inline-flex;margin-top:22px;padding:12px 18px;border-radius:999px;text-decoration:none;color:#1a1520;background:linear-gradient(120deg,var(--pink),var(--peach));font-weight:700}
</style>
</head>
<body>
<main class="card">
<div class="kicker">MESSAGE RECEIVED</div>
<div class="mark">💌</div>
<h1>That made it <em>through.</em></h1>
<p>Your reply and voice note were handed to the form service. You can close this tab and go back to the birthday journey.</p>
<div class="note">Your voice note was submitted as an attachment.</div>
<a class="back" href="./">Back to the birthday journey →</a>
</main>
</body>
</html>
