<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Reply sent ❤️</title>
  <style>
    :root{color-scheme:dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d17;color:#f4edf6;font-family:Arial,sans-serif}
    main{max-width:520px;padding:42px;text-align:center}
    .orb{width:74px;height:74px;margin:0 auto 24px;border-radius:50%;background:linear-gradient(135deg,#f2a9c9,#f5d6ae);box-shadow:0 0 70px rgba(242,169,201,.25)}
    h1{font-family:Georgia,serif;font-size:48px;margin:0 0 12px}
    p{color:#a9a7b9;line-height:1.7}
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <h1>Reply received ❤️</h1>
    <p>Your message and voice note reached the form service. You can close this tiny confirmation page.</p>
  </main>
  <script>
    try{window.parent.postMessage({type:'shejal-form-success'}, window.location.origin)}catch(_){}
  </script>
</body>
</html>
